<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="900" height="60" role="img" aria-label="Footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#451126" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="60" fill="#10070C" rx="10"/>
  <rect x="100" y="28" width="700" height="2" fill="url(#foot-line)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cy="29" r="3.5" fill="#E5B5C7">
    <animate attributeName="cx" values="100;800;100" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#C77B9B">Thanks for visiting</text>
</svg>
