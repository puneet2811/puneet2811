<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Puneet Singh, Data Science Student, Data Analyst, Problem Solver" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PUNEET SINGH</title>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="hero-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <pattern id="hero-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#701A3D" stroke-opacity="0.28" stroke-width="0.6"/>
    </pattern>
    <filter id="hero-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hero-clip"><rect width="900" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="900" height="300" fill="url(#hero-bg)"/>
    <rect width="900" height="300" fill="url(#hero-grid)"/>

    <!-- slow moving light -->
    <ellipse cx="150" cy="150" rx="260" ry="200" fill="url(#hero-light)">
      <animate attributeName="cx" values="150;720;150" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="110;200;110" dur="11s" repeatCount="indefinite"/>
    </ellipse>

    <!-- orbital geometry -->
    <g fill="none" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1">
      <circle cx="770" cy="150" r="70"/>
      <circle cx="770" cy="150" r="110" stroke-dasharray="3 7"/>
      <circle cx="770" cy="150" r="150" stroke-opacity="0.15"/>
    </g>
    <g>
      <circle r="5" fill="#E5B5C7" filter="url(#hero-glow)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M770,80 a70,70 0 1,1 -0.1,0"/>
      </circle>
      <circle r="3.5" fill="#C77B9B">
        <animateMotion dur="14s" repeatCount="indefinite" path="M770,260 a110,110 0 1,0 0.1,0"/>
      </circle>
    </g>

    <!-- drawn path -->
    <path d="M40 250 C 180 215, 260 270, 400 235 S 620 200, 860 245" fill="none"
          stroke="url(#hero-line)" stroke-width="2" stroke-linecap="round" pathLength="1">
      <animate attributeName="stroke-dasharray" values="0 1;1 0" dur="3s" begin="0s" fill="freeze"/>
    </path>

    <!-- text -->
    <text x="48" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#F8F0F3" letter-spacing="1">PUNEET SINGH</text>
    <text x="50" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#E5B5C7" letter-spacing="1.5">Data Science Student  |  Data Analyst  |  Problem Solver</text>

    <!-- glowing underline -->
    <rect x="50" y="188" width="180" height="3" rx="1.5" fill="url(#hero-line)" filter="url(#hero-glow)">
      <animate attributeName="width" values="0;180" dur="1.6s" fill="freeze"/>
    </rect>
  </g>
</svg>
